<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F4D3A'/%3E%3Ctext x='29' y='46' font-family='Georgia,serif' font-size='42' fill='%23F7F1E1' text-anchor='middle'%3EP%3C/text%3E%3Ccircle cx='47' cy='43' r='4' fill='%23C8A96A'/%3E%3C/svg%3E">
<title>Parole</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&display=swap">
<style>
:root{
  /* Clarté et retenue : grands titres, surfaces arrondies, un seul accent ; la tuile sombre du haut porte l'échéance comme un tableau de bord */
  --bg:#F5F5F7; --surface:#FFFFFF; --surface2:#E9E9ED; --ink:#1D1D1F; --muted:#5F5F67; --line:#D6D6DB;
  --accent:#0058C7; --on-accent:#FFFFFF; --kept:#0B7A3B; --broken:#C2261A; --wait:#855400;
  --glass:rgba(245,245,247,.8); --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.06);
  --font:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rule:var(--line); --paper:var(--bg); --sheet:var(--surface); --stamp:var(--accent);
  --hero:var(--ink); --on-hero:var(--bg); --display:var(--font); --radius:22px; --rbtn:999px; --hair:transparent;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --ink:#F5F5F7; --muted:#A9A9B0; --line:#3A3A3C;
    --accent:#5AA9FF; --on-accent:#00162F; --kept:#32D465; --broken:#FF6B61; --wait:#FFD23A;
    --glass:rgba(0,0,0,.74); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --ink:#F5F5F7; --muted:#A9A9B0; --line:#3A3A3C;
  --accent:#5AA9FF; --on-accent:#00162F; --kept:#32D465; --broken:#FF6B61; --wait:#FFD23A;
  --glass:rgba(0,0,0,.74); --shadow:none; color-scheme:dark;
}

/* Ambiances « gentleman moderne » : ivoire, sapin ou chocolat, filets laiton, titres en Caslon */
:root[data-skin="sapin"]{ --bg:#F4F0E6; --surface:#FBF8F1; --surface2:#E8E1D0; --ink:#16241D; --muted:#56615A; --line:#D3CBB8; --accent:#1F4D3A; --on-accent:#F7F1E1; --kept:#1F6B45; --broken:#9E2B1F; --wait:#7A5A12; --glass:rgba(244,240,230,.84); --hero:#1F4D3A; --on-hero:#F7F1E1; --hair:#B2955A; }
:root[data-skin="chocolat"]{ --bg:#F3ECE2; --surface:#FBF6EE; --surface2:#E9DDCD; --ink:#2A1A12; --muted:#6B574B; --line:#D8C8B5; --accent:#5A3521; --on-accent:#F8EFE2; --kept:#2F6B45; --broken:#A12D22; --wait:#7C5510; --glass:rgba(243,236,226,.84); --hero:#4A2B1B; --on-hero:#F8EFE2; --hair:#B98A56; }
@media (prefers-color-scheme: dark){
  :root[data-skin="sapin"]:not([data-theme="light"]){ --bg:#0E1A15; --surface:#16261F; --surface2:#20362C; --ink:#EFE9DA; --muted:#A9B3A8; --line:#2E4439; --accent:#C8A96A; --on-accent:#1A1408; --kept:#6FCF97; --broken:#F08A7B; --wait:#E5C46B; --glass:rgba(14,26,21,.82); --hero:#1F4D3A; --on-hero:#F7F1E1; --hair:#8C7443; color-scheme:dark; }
  :root[data-skin="chocolat"]:not([data-theme="light"]){ --bg:#17100C; --surface:#231812; --surface2:#33241A; --ink:#F1E7DA; --muted:#B7A698; --line:#463427; --accent:#D2A679; --on-accent:#22140A; --kept:#7BCB98; --broken:#F29080; --wait:#E8C36E; --glass:rgba(23,16,12,.82); --hero:#4A2B1B; --on-hero:#F8EFE2; --hair:#8F6A42; color-scheme:dark; }
}
:root[data-skin="sapin"][data-theme="dark"]{ --bg:#0E1A15; --surface:#16261F; --surface2:#20362C; --ink:#EFE9DA; --muted:#A9B3A8; --line:#2E4439; --accent:#C8A96A; --on-accent:#1A1408; --kept:#6FCF97; --broken:#F08A7B; --wait:#E5C46B; --glass:rgba(14,26,21,.82); --hero:#1F4D3A; --on-hero:#F7F1E1; --hair:#8C7443; color-scheme:dark; }
:root[data-skin="chocolat"][data-theme="dark"]{ --bg:#17100C; --surface:#231812; --surface2:#33241A; --ink:#F1E7DA; --muted:#B7A698; --line:#463427; --accent:#D2A679; --on-accent:#22140A; --kept:#7BCB98; --broken:#F29080; --wait:#E8C36E; --glass:rgba(23,16,12,.82); --hero:#4A2B1B; --on-hero:#F8EFE2; --hair:#8F6A42; color-scheme:dark; }
:root[data-skin]{ --display:"Libre Caslon Display","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif; --radius:14px; --rbtn:10px; --shadow:none; }
:root[data-skin] .top h1,:root[data-skin] .mark,:root[data-skin] .ptxt,:root[data-skin] .phead h2,:root[data-skin] .modal h2,:root[data-skin] .tile .num,:root[data-skin] .tile .big,:root[data-skin] .tally b,:root[data-skin] .pitch h2,:root[data-skin] .prose h3,:root[data-skin] .ringtxt b,:root[data-skin] .cele .num{font-family:var(--display);font-weight:400;letter-spacing:-.005em}
:root[data-skin] .top h1{font-size:2.5rem} :root[data-skin] .ptxt{font-size:1.5rem;line-height:1.22} :root[data-skin] .mark{font-size:2rem}
:root[data-skin] .mark i{color:var(--hair)}
:root[data-skin] .card,:root[data-skin] .tile,:root[data-skin] .box,:root[data-skin] .person,:root[data-skin] .notif,:root[data-skin] .toggle,:root[data-skin] .tally div,:root[data-skin] .modal{border:1px solid var(--line)}
:root[data-skin] .tile.main{border:1px solid var(--hair)}
:root[data-skin] .h2,:root[data-skin] .tile .lab,:root[data-skin] .box h3,:root[data-skin] .tag{letter-spacing:.16em;font-size:.7rem}
:root[data-skin] .h2{border-bottom:1px solid var(--hair);margin:10px 16px 12px;padding:14px 4px 8px}
:root[data-skin] .rail .person{border:0;border-top:1px solid var(--line)}
:root[data-skin] .nav a[aria-current="page"]{border:1px solid var(--hair)}
:root[data-skin] .projet{border-color:var(--hair)}
:root[data-skin] .s-tenue{box-shadow:inset 0 0 0 1px currentColor;background:transparent}
:root[data-contrast="more"]{--muted:var(--ink);--line:var(--ink)}
@media (prefers-contrast: more){:root{--muted:var(--ink);--line:var(--ink)}}
:root[data-size="l"]{font-size:112.5%} :root[data-size="xl"]{font-size:125%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:30;text-decoration:none}
.skip:focus{top:12px}
.shell{display:grid;grid-template-columns:236px minmax(0,660px) 304px;gap:0 22px;max-width:1260px;margin:0 auto;padding:0 16px}
.side{position:sticky;top:0;align-self:start;padding:22px 0;display:flex;flex-direction:column;gap:18px}
.mark{font-size:1.75rem;font-weight:700;letter-spacing:-.03em;padding:0 14px}
.mark i{font-style:normal;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:14px;min-height:48px;padding:0 14px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;font-size:1.06rem;transition:background .15s}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--accent);font-weight:650;box-shadow:var(--shadow)}
.nav svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{margin-left:auto;font-size:.75rem;font-weight:700;background:var(--broken);color:var(--surface);min-width:22px;text-align:center;padding:3px 6px;border-radius:11px}
.speak{display:flex;align-items:center;justify-content:center;gap:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:650;min-height:52px;border-radius:var(--rbtn);transition:transform .12s}
.speak:active,.btn:active,.act:active,.play:active,.fab:active{transform:scale(.96)}
.speak svg{width:20px;height:20px;fill:currentColor}
.src{font-size:.8rem;line-height:1.45;color:var(--muted);padding:0 14px;display:grid;gap:8px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;min-height:38px;padding:0 8px;border-radius:9px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font:inherit;text-align:left}
main{min-height:100dvh;padding-bottom:96px}
main:focus{outline:none}
.top{position:sticky;top:0;z-index:3;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);padding:20px 20px 12px;margin-bottom:8px}
.top h1{font-size:2.1rem;font-weight:700;line-height:1.1;margin:0 0 12px;letter-spacing:-.03em}
.tabs{display:inline-flex;max-width:100%;overflow-x:auto;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:0;background:none;min-height:38px;padding:0 14px;border-radius:9px;font-size:.88rem;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pad{padding:8px 16px 14px}
.h2{font-size:.8rem;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:18px 22px 8px;display:flex;justify-content:space-between;gap:10px}
.empty{margin:0 16px 12px;padding:22px;color:var(--muted);text-align:center;border-radius:20px;border:1px dashed var(--line)}
/* tableau de bord */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px 12px}
.tile{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.tile.main{grid-column:1/-1;background:var(--hero);color:var(--on-hero);flex-direction:row;align-items:center;gap:20px;box-shadow:none;padding:22px}
.tile .lab{font-size:.78rem;font-weight:650;text-transform:uppercase;letter-spacing:.06em;opacity:.72}
.tile .big{font-size:1.3rem;font-weight:650;line-height:1.25;letter-spacing:-.015em;margin:4px 0 2px;overflow-wrap:break-word}
.tile .num{font-size:2.6rem;font-weight:700;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .small{font-size:.82rem;line-height:1.4;color:var(--muted)}
.grow{flex:1;min-width:0}
.ring{position:relative;width:104px;height:104px;flex:none}
.ringsvg{width:100%;height:100%}
.rbg{fill:none;stroke:currentColor;opacity:.18;stroke-width:9}
.rfg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringtxt b{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.ringtxt span{font-size:.72rem;opacity:.75}
/* cartes */
.card{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 12px;padding:18px;margin:0 16px 12px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
:root[data-contrast="more"] .card,:root[data-contrast="more"] .tile,:root[data-contrast="more"] .box,:root[data-contrast="more"] .person,:root[data-contrast="more"] .notif,:root[data-contrast="more"] .toggle{border:2px solid var(--ink)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;font-weight:650;color:#fff;flex:none;border:0}
.av.s{width:32px;height:32px;font-size:.72rem}.av.xl{width:92px;height:92px;font-size:1.8rem;border:4px solid var(--bg)}
.hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.nm{font-weight:650;background:none;border:0;padding:0;text-align:left;line-height:1.3}
.nm:hover{text-decoration:underline}
.sub{font-size:.86rem;line-height:1.35;color:var(--muted)}
.kind .pill{margin-left:auto}
.kind{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 2px;font-size:.8rem;font-weight:600;color:var(--muted)}
.dd{color:var(--ink)} .dd.soon{color:var(--broken)}
.stamp,.pill{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:650;padding:5px 11px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,currentColor 13%,transparent)}
.stamp{margin-left:auto}
.s-tenue{color:var(--kept)} .s-rompue,.s-contestee{color:var(--broken)} .s-attente{color:var(--wait)} .s-encours{color:var(--accent)} .s-abandon,.s-sanstemoin,.s-partielle{color:var(--muted)}
.s-tenue::before{content:"✓"} .s-rompue::before{content:"✕"} .s-contestee::before{content:"!"} .s-attente::before{content:"…"} .s-partielle::before{content:"½"}
.pill.ok{color:var(--kept)} .pill.dur{color:var(--wait)}
.ptxt{font-size:1.32rem;font-weight:650;line-height:1.25;letter-spacing:-.015em;margin:6px 0 8px;overflow-wrap:anywhere}
.vtxt{font-size:1.02rem;line-height:1.5;margin:8px 0;overflow-wrap:anywhere}
.meta{font-size:.82rem;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.proof{margin:8px 0;padding:10px 12px;background:var(--surface2);border-left:3px solid var(--line);border-radius:10px;font-size:.92rem;overflow-wrap:anywhere}
.player{display:flex;align-items:center;gap:10px;margin-top:10px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .12s}
.play svg{width:15px;height:15px;fill:currentColor}
.wave{display:flex;align-items:center;gap:2px;height:32px;flex:1;min-width:0;overflow:hidden}
.wave i{flex:1;max-width:5px;min-width:2px;background:var(--line);border-radius:3px;transition:background .15s}
.wave i.on{background:var(--accent)}
.dur{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;min-height:36px;font-size:.84rem;font-weight:600;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted)}
button.chip:hover,button.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.act{display:inline-flex;align-items:center;gap:7px;min-height:44px;border:0;background:var(--surface2);border-radius:var(--rbtn);padding:0 16px;font-size:.88rem;font-weight:600;transition:transform .12s}
.act.on{background:var(--ink);color:var(--bg)}
.act.ok{background:var(--kept);color:var(--surface)} .act.ko{background:transparent;box-shadow:inset 0 0 0 1.5px var(--broken);color:var(--broken)}
.act:disabled{opacity:.45;cursor:not-allowed}
.thread{grid-column:2;margin-top:14px;border-left:2px solid var(--line);padding-left:12px;display:grid;gap:14px}
.rep{display:grid;grid-template-columns:32px minmax(0,1fr);gap:0 10px}
.rep .vtxt{font-size:.96rem;margin:2px 0 0}
/* profil */
.cover{height:120px;margin:0 16px;border-radius:24px;background:linear-gradient(120deg,var(--accent),var(--kept));opacity:.85}
.phead{padding:0 22px 8px}
.phead .rowtop{position:relative;display:flex;justify-content:space-between;align-items:flex-end;margin-top:-46px;gap:12px;padding-left:10px}
.phead h2{font-size:1.9rem;font-weight:700;line-height:1.1;margin:10px 0 2px;letter-spacing:-.03em}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:14px}
.tally div{background:var(--surface);border-radius:16px;padding:12px;font-size:.76rem;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.tally b{display:block;font-size:1.5rem;font-weight:700;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;font-size:.92rem;font-weight:650;padding:0 18px;border-radius:var(--rbtn);border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);transition:transform .12s}
.btn.ghost{background:transparent;color:var(--accent)} .btn.ok{background:var(--kept);border-color:var(--kept);color:var(--surface)}
.btn.inv{background:var(--on-hero);border-color:var(--on-hero);color:var(--hero)} .btn.inv.ghost{background:transparent;color:inherit;border-color:currentColor}
.search{width:100%;min-height:48px;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.person,.notif,.toggle{background:var(--surface);border-radius:18px;margin:0 16px 8px;box-shadow:var(--shadow)}
.person{display:flex;align-items:center;gap:12px;padding:12px 14px}
.notif{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;align-items:baseline}
.tag{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.tag.red{color:var(--broken)} .tag.green{color:var(--kept)}
.rail{position:sticky;top:0;align-self:start;padding:22px 0;display:grid;gap:14px}
.box{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.box h3{font-size:.8rem;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.mini{display:grid;grid-template-columns:46px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem;line-height:1.35}
.mini:first-of-type{border-top:0}
.mini b{font-weight:700;font-variant-numeric:tabular-nums}
.rail .person{padding:9px 0;margin:0;border-radius:0;box-shadow:none;border-top:1px solid var(--line);background:none}
.rail .person:first-of-type{border-top:0}
:root[data-contrast="more"] .rail .person{border:0;border-top:1px solid var(--ink)}
.prose{padding:0 22px 30px;max-width:66ch}
.prose h3{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:30px 0 8px}
.prose p{margin:0 0 12px}
.prose dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:12px 0}
.prose dt{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.9;color:var(--accent)}
.prose dd{margin:0}
.tbox{overflow-x:auto;margin:12px 0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.ptable{border-collapse:collapse;width:100%;min-width:620px;font-size:.86rem}
.ptable th,.ptable td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.ptable th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ptable tr:last-child td{border-bottom:0;font-weight:650;color:var(--accent)}
.toggle{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:14px 16px;align-items:center}
.sw{width:52px;height:32px;border-radius:16px;border:0;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .18s}

    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    S.uid = uid; S.canReal = true;
    let got = 0;
    const timer = setTimeout(() => { S.stale = true; render(); }, 10000);
    ["paroles","temoins","voix"].forEach(kind => db.collection(kind).onSnapshot(snap => {
      const next = bag();
      snap.docs.forEach(doc => { const data = doc.data(); if (data) next[doc.id] = sanitize(kind, clone(data)); });
      DATA.reel[kind] = next;
      if (!snap.metadata.fromCache){ got++; if (got >= 3){ clearTimeout(timer); S.stale = false; } }
      if (S.src === "reel") schedule();
      refreshNames();
    }, () => { clearTimeout(timer); S.stale = true; render(); }));
    render();
  } catch(e){}
}

/* ---------- lecture vocale (synthèse dans ce prototype) ---------- */
let playing = null;
function stopPlay(){
  if (!playing) return;
  clearInterval(playing.timer);
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
  playing.bars.forEach(b => b.classList.remove("on"));
  playing.btn.replaceChildren(icon("play")); playing = null;
}
function icon(n){
  const el = document.createElementNS("http://www.w3.org/2000/svg","svg"); el.setAttribute("viewBox","0 0 24 24");
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", n === "play" ? "M7 4v16l13-8z" : n === "stop" ? "M6 6h12v12H6z" : "M12 15a4 4 0 004-4V6a4 4 0 00-8 0v5a4 4 0 004 4zm7-4h-2a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-3.1A7 7 0 0019 11z");
  el.append(p); return el;
}
const durOf = (t) => Math.max(3, Math.round(String(t).length / 14));
function player(text, small){
  const n = small ? 22 : 40, seed0 = hash(text), bars = [];
  for (let i = 0; i < n; i++){ const v = (Math.sin(seed0 % 97 + i * 1.7) + Math.sin(i * 0.45 + seed0 % 13) + 2) / 4; bars.push(h("i", {style:"height:" + Math.round(18 + v * 82) + "%"})); }
  const d = durOf(text);
  const btn = h("button", {class:"play", "aria-label":"Écouter", onclick:() => {
    const was = playing && playing.btn === btn; stopPlay(); if (was) return;
    let i = 0;
    playing = { btn, bars, timer: setInterval(() => { if (i < bars.length) bars[i++].classList.add("on"); else stopPlay(); }, d * 1000 / bars.length) };
    btn.replaceChildren(icon("stop"));
    try { if (window.speechSynthesis){ const u = new SpeechSynthesisUtterance(text); u.lang = "fr-FR"; window.speechSynthesis.speak(u); } } catch(e){}
  }}, icon("play"));
  return h("div", {class:"player"}, btn, h("div", {class:"wave", "aria-hidden":"true"}, bars), h("span", {class:"dur"}, "0:" + String(d).padStart(2,"0")));
}
